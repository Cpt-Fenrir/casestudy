<ion-content [fullscreen]="true" class="pomodoro-page">
  <div class="page-shell">
    <h1 class="brand">TIMESYNC</h1>

    <div class="ring">
      <div class="digits">{{ (time$ | async) }}</div>
    </div>

    <ion-button class="start-btn" color="mint" (click)="toggle()">
      {{ running ? 'Pause' : 'Start' }}
    </ion-button>

    <div class="features">
      <button class="feature" type="button" (click)="openTimerMode()">
        <ion-icon name="timer-outline"></ion-icon>
        <span>Timer Mode</span>
      </button>
      <button class="feature" type="button" (click)="goFullscreen()">
        <ion-icon name="expand-outline"></ion-icon>
        <span>Fullscreen</span>
      </button>
      <button class="feature" type="button" (click)="openWhiteNoise()">
        <ion-icon name="musical-notes-outline"></ion-icon>
        <span>White Noise</span>
      </button>
    </div>
  </div>

  <!-- Timer Mode sheet -->
  <ion-modal *ngIf="timerModeOpen" [isOpen]="true" (didDismiss)="timerModeOpen=false" cssClass="sheet-modal">
    <ng-template>
      <div class="sheet-card">
        <div class="sheet-title">Timer Mode</div>

        <ion-list lines="none">
          <ion-item button detail="false" (click)="mode='down'">
            <ion-label>
              <h3>20:00 &rarr; 00:00</h3>
              <p>Count down from 20:00 until the time is up.</p>
            </ion-label>
            <ion-icon slot="end" name="checkmark-outline" *ngIf="mode==='down'"></ion-icon>
          </ion-item>

          <ion-item button detail="false" (click)="mode='up'">
            <ion-label>
              <h3>00:00 &rarr; &infin;</h3>
              <p>Start counting from 00:00 until manually stopped.</p>
            </ion-label>
            <ion-icon slot="end" name="checkmark-outline" *ngIf="mode==='up'"></ion-icon>
          </ion-item>
        </ion-list>

        <div class="sheet-actions">
          <ion-button fill="outline" (click)="timerModeOpen=false">Cancel</ion-button>
          <ion-button color="mint" (click)="confirmTimerMode()">Confirm</ion-button>
        </div>
      </div>
    </ng-template>
  </ion-modal>

  <!-- White Noise sheet -->
  <ion-modal *ngIf="whiteNoiseOpen" [isOpen]="true" (didDismiss)="whiteNoiseOpen=false" cssClass="sheet-modal">
    <ng-template>
      <div class="sheet-card">
        <div class="sheet-title">White Noise</div>

        <ion-list lines="none">
          <ion-radio-group [(ngModel)]="selectedNoise">
            <ion-item *ngFor="let n of noiseOptions">
              <ion-label>{{ n }}</ion-label>
              <ion-radio slot="end" [value]="n"></ion-radio>
            </ion-item>
          </ion-radio-group>
        </ion-list>

        <div class="sheet-actions">
          <ion-button color="mint" (click)="confirmWhiteNoise()">Confirm</ion-button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</ion-content>

<ion-footer class="bottom-nav">
  <ion-toolbar>
    <div class="nav-buttons">
      <ion-button fill="clear" size="small" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img class="nav-icon default" src="assets/icons/nav/Home_Outline.png" alt="Home">
        <img class="nav-icon active" src="assets/icons/nav/Home_Solid.png" alt="Home active">
        <span class="nav-label">Home</span>
      </ion-button>
      <ion-button fill="clear" size="small" routerLink="/tasks" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img class="nav-icon default" src="assets/icons/nav/Checked_Checkbox_Outline.png" alt="Tasks">
        <img class="nav-icon active" src="assets/icons/nav/Checked_Checkbox_Solid.png" alt="Tasks active">
        <span class="nav-label">Tasks</span>
      </ion-button>
      <ion-button fill="clear" size="small" routerLink="/pomodoro" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img class="nav-icon default" src="assets/icons/nav/Alarm_Clock_Outline.png" alt="Pomodoro">
        <img class="nav-icon active" src="assets/icons/nav/Alarm_Clock_Solid.png" alt="Pomodoro active">
        <span class="nav-label">Pomodoro</span>
      </ion-button>
      <ion-button fill="clear" size="small" routerLink="/analytics" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <img class="nav-icon default" src="assets/icons/nav/Statistics_Solid.png" alt="Analytics">
        <img class="nav-icon active" src="assets/icons/nav/Statistics_Solid.png" alt="Analytics active">
        <span class="nav-label">Analytics</span>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
